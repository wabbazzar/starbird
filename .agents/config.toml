# starbird agent install config
# Read by ~/code/shipyard/agents/{release,build,medic,scribe}/runner.sh
# via the shared lib/load-config.sh path. Project-specific knobs only;
# generic agent code stays in the shipyard repo's agents/.

project_name  = "starbird"
project_dir   = "/home/wabbazzar/code/starbird"
project_owner = "wabbazzar"
branch        = "main"
dev_port      = 5173

[install.timers]
# OnCalendar values written verbatim into ~/.config/systemd/user/<project>-<agent>.timer
# by scripts/install-quartet.sh. Override the installer defaults here so
# the schedule lives with the project, not in the installer.
#
# House rule for starbird: scribe/helldiver/proctor fire between 01:00–05:00
# local so their notifications don't land while Wesley is awake. Medic is
# the exception — it scans around the clock (every 10 min) so failures are
# caught within a tick, not at the next quiet-hours window; it just skips
# 01:00–04:59 to stay out of the other three agents' way. (Matches the
# installed timer; updated 2026-06-05 after the Jun 4/5 silent runner
# failures showed intraday detection earns its keep.)
scribe   = "*-*-* 01:00:00"
medic    = "*-*-* 00,05..23:00/10:00"
build    = "*-*-* 03:30:00"
release  = "*-*-* 04:30:00"

[paths]
# data.json is the source of truth and the recurring failure surface.
# Surfaced separately so the release agent can deep-audit it without
# scanning the rest of the repo.
data         = "static/data.json"
result_dir   = "tmp"
worktree_dir = ".worktrees"

[release]
# Identical to the gate the runner already invokes. Re-running it inside
# the release agent gives us pre-commit-gate equivalent enforcement on any
# commit, not just runner commits — covering the case where a human edit
# drops bad data in.
test_cmd     = "npx vitest run"
typecheck    = "npx svelte-check --threshold error"
data_audit   = "npx tsx scripts/validate-data.mjs"
build_cmd    = "npm run build"

[build]
# The build agent is allowed to touch the runner prompt + runner script +
# the new data-coercion shim (see
# docs/tickets/complete/install-guardian-augur-medic.md for the proposed
# shim). Schema.ts and data.json itself are off-limits
# — schema is the contract and data is the runner's territory.
in_scope_paths = [
  "src/lib/**",
  "src/routes/**",
  "src/lib/components/**",
  "tests/**",
  "scripts/starbird-runner-prompt.md",
  "scripts/starbird-runner.sh",
  "scripts/validate-data.mjs",
  "scripts/coerce-data.mjs",
  "scripts/generate-card-images.py",
  "scripts/labels.py",
  "scripts/pick-strategy.py",
  "scripts/update-strategy-scores.py",
  "scripts/compute-run-metrics.py",
]
forbidden_paths = [
  "src/lib/schema.ts",        # schema is the contract — data conforms to it, not vice versa
  "static/data.json",         # only runner or human writes data; build fixes the runner, not the data
  "static/cards/**",          # generated artifacts
  "static/manifest.webmanifest",
  ".agents/**",
  ".github/workflows/**",
]
wall_clock_sec  = 1800

[medic]
poll_interval_sec    = 600
sync_to_build        = true
daily_escalation_cap = 3
restart_systemd      = false   # starbird has no systemd surface to restart
can_merge      = false   # one-actor project; human stays in the merge loop

# Liveness probe: fetch the deployed data.json and try to parse it
# against the schema. If the live site is serving zod-invalid data
# (the recurring failure mode), this fires and medic escalates.
[[medic.probes]]
name          = "starbird-live-data"
url           = "https://starbird42.com/data.json"
expect_status = 200
timeout_sec   = 15
# Tells medic to run scripts/validate-data.mjs against the fetched body
# (not just status code). Without the extra step a 200 with corrupt
# JSON would look healthy.
post_check    = "npx tsx scripts/validate-data.mjs --from-stdin"

# Success heartbeat: the daily 07:05 runner must COMPLETE cleanly, not just
# start. 2026-06-04/05: cron fired but the script died 4s in (auto-updater
# GC'd its pinned claude binary; the PATH fallback failed under cron's bare
# PATH) — invisible to the cron-fire ageSec check, which only goes stale at
# 10x interval (10 days for a daily job). This check reads the runner's own
# last-run log and fires when the success marker is missing or the log is
# older than max_age_hours. grace_hours keeps an in-progress run (marker
# not written yet) from false-positiving.
[[medic.freshness]]
name          = "starbird-runner-daily"
log           = "tmp/starbird-runner-last-run.log"
success_regex = '\[starbird-runner\] Done\. exit=0'
max_age_hours = 30
grace_hours   = 2

[scribe]
# Doc curator. Starbird's docs surface is small (CLAUDE.md + the
# ticket-tracking docs/ folder), so scope is correspondingly narrow.
content_paths = ["CLAUDE.md", "docs/"]
wall_clock_sec        = 900
commit_message_prefix = "scribe: nightly refresh"
auto_commit           = true
auto_push             = false
allow_prose_rewrites  = true
allow_file_moves      = true
forbid_file_deletion  = true
forbid_ticket_creation = true


[names]
design = "mentat"
build = "helldiver"
release = "proctor"
medic = "suk"
scribe = "chronicler"

[write_ticket]
# Read before drafting: root context + the verification-gate surface the
# ticket's phases must name. scripts/starbird-runner-prompt.md matters for
# any runner/strategy-bank work (3 parallel files must stay in sync — see
# CLAUDE.md §Strategy bank).
context_files   = [
  "CLAUDE.md",
  ".agents/gates.md",
  "scripts/starbird-runner-prompt.md",
]
ticket_dir      = "docs/tickets/pending"
archive_dir     = "docs/tickets/complete"
backlog_dir     = "docs/tickets/freezer"
scan_dirs       = ["docs/tickets/pending", "docs/tickets/complete", "docs/tickets/freezer"]
lifecycle_dirs  = true
types           = ["feature", "bug", "refactor", "chore", "docs", "test"]
id_width        = 3
# Filename: docs/tickets/XXX_<type>_<short_description>.md. Pre-existing
# tickets (shop-skill.md, prune-stale-medic-incidents-design-summary.md,
# archive/install-guardian-augur-medic.md) predate numbering — leave them;
# numbering starts at 001 for new tickets.
point_scale     = [1, 2, 3, 5, 8]
phase_point_cap = 5
viewport        = "390x844"   # PWA (static/manifest.webmanifest); UI phases verify mobile-first
test_cmds       = [
  "npx vitest run",
  "npx svelte-check --threshold error",
  "npx tsx scripts/validate-data.mjs",
  "npx tsx scripts/dq-check.mjs",
  "npm run build",
]
house_rules     = """
Commit style matches git history: `area: imperative description` (areas seen: \
runner, agents, gates, scribe, data, ui, scripts, docs) — no conventional-commit \
type(scope) format. \
src/lib/schema.ts is the contract and static/data.json is the runner's territory \
— tickets fix the runner/coercion shim, never hand-edit data.json (mirrors the \
[build] forbidden_paths). \
Every harm tag needs evidence in `why` (brands) / `summary` (firms) — a ticket \
touching tags must keep the evidence rule intact. \
Deploy is adapter-static to GitHub Pages; there is no server process — phases \
verify via the gate classes in .agents/gates.md, and `npm run preview` serves \
only the BUILT output (rebuild before checking)."""

[[medic.checks]]
# Crew-install drift: doctor audits what this install owns (units, foreign
# drop-ins, retired config keys, dead hooks, skill symlinks). Read-only, <1s.
# Notify-only — remediation is uninstall+reinstall or a stamped ticket, never
# a medic reflex.
name        = "crew-install-drift"
cmd         = 'bash "$QUARTET_DIR/install.sh" --doctor --project .'
timeout_sec = 30
