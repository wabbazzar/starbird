# starbird agent install config
# Read by /home/wabbazzar/code/wabbazzar-ice/agents/{guardian,augur,medic,scribe}/runner.sh
# via the shared lib/load-config.sh path. Project-specific knobs only;
# generic agent code stays in the wabbazzar-ice repo's agents/.

project_name  = "starbird"
project_dir   = "/home/wabbazzar/code/starbird"
project_owner = "wabbazzar"
branch        = "main"
dev_port      = 5173

[install.timers]
# OnCalendar values written verbatim into ~/.config/systemd/user/<project>-<agent>.timer
# by scripts/install-quartet.sh. Override the installer defaults here so
# the schedule lives with the project, not in the installer.
guardian = "*-*-* 06:00:00"
medic    = "*-*-* *:0/10:00"
augur    = "*-*-* 03:30:00"
scribe   = "*-*-* 01:00:00"

[paths]
# data.json is the source of truth and the recurring failure surface.
# Surfaced separately so guardian can deep-audit it without scanning
# the rest of the repo.
data         = "static/data.json"
result_dir   = "tmp"
worktree_dir = ".worktrees"

[guardian]
# Identical to the gate the runner already invokes. Re-running it inside
# guardian gives us pre-commit-gate equivalent enforcement on any commit,
# not just runner commits — covering the case where a human edit drops
# bad data in.
test_cmd     = "npx vitest run"
typecheck    = "npx svelte-check --threshold error"
data_audit   = "npx tsx scripts/validate-data.mjs"
build_cmd    = "npm run build"
budget_hook  = 0.50   # fast pre-commit / hook mode
budget_daily = 2.00   # daily deep-audit mode

[augur]
# Augur is allowed to touch the runner prompt + runner script + the new
# data-coercion shim (see docs/tickets/install-guardian-augur-medic.md
# for the proposed shim). Schema.ts and data.json itself are off-limits
# — schema is the contract and data is the runner's territory.
in_scope_paths = [
  "src/lib/**",
  "src/routes/**",
  "src/lib/components/**",
  "tests/**",
  "scripts/starbird-runner-prompt.md",
  "scripts/starbird-runner.sh",
  "scripts/validate-data.mjs",
  "scripts/generate-card-images.py",
  "scripts/labels.py",
  "scripts/pick-strategy.py",
  "scripts/update-strategy-scores.py",
  "scripts/compute-run-metrics.py",
]
forbidden_paths = [
  "src/lib/schema.ts",        # schema is the contract — data conforms to it, not vice versa
  "static/data.json",         # only runner or human writes data; augur fixes the runner, not the data
  "static/cards/**",          # generated artifacts
  "static/manifest.webmanifest",
  ".agents/**",
  ".github/workflows/**",
]
budget          = 5.00
budget_incident = 8.00
wall_clock_sec  = 1800

[medic]
poll_interval_sec    = 600
sync_to_augur        = true
daily_escalation_cap = 3
restart_systemd      = false   # starbird has no systemd surface to restart
augur_can_merge      = false   # one-actor project; human stays in the merge loop

# Liveness probe: fetch the deployed data.json and try to parse it
# against the schema. If the live site is serving zod-invalid data
# (the recurring failure mode), this fires and medic escalates.
[[medic.probes]]
name          = "starbird-live-data"
url           = "https://starbird42.com/data.json"
expect_status = 200
timeout_sec   = 15
# Tells medic to run scripts/validate-data.mjs against the fetched body
# (not just status code). Without the extra step a 200 with corrupt
# JSON would look healthy.
post_check    = "npx tsx scripts/validate-data.mjs --from-stdin"

[scribe]
# Doc curator. Starbird's docs surface is small (CLAUDE.md + the
# ticket-tracking docs/ folder), so scope is correspondingly narrow.
content_paths = ["CLAUDE.md", "docs/"]
budget                = 3.00
wall_clock_sec        = 900
commit_message_prefix = "scribe: nightly refresh"
auto_commit           = true
auto_push             = false
allow_prose_rewrites  = true
allow_file_moves      = true
forbid_file_deletion  = true
forbid_ticket_creation = true
